[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphtransport"
version = "0.1.0"
description = "Optimal transport on graphs: geodesics, distances and barycenters, differentiable with PyTorch."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "David Gentile" }]
keywords = ["optimal transport", "Wasserstein", "graphs", "barycenters", "Markov chains", "PyTorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# torch is the shooting solver's autodiff: the exact Jacobian of the Hamiltonian flow
dependencies = ["numpy", "scipy", "torch"]

[project.urls]
Documentation = "https://dcgentile.github.io/graphtransport-py/"
Source = "https://github.com/dcgentile/graphtransport-py"
Paper = "https://arxiv.org/abs/2603.26940"
"Julia package" = "https://github.com/dcgentile/GraphTransportation.jl"

[project.optional-dependencies]
dev = ["pytest"]
jax = ["jax"]
socp = ["cvxpy", "clarabel"]
# notebooks/demo.ipynb; needs socp too
notebook = ["matplotlib", "nbformat", "nbclient", "ipykernel"]
# the documentation site (mkdocs.yml); its figures (docs/figures/make_figures.py) also need socp.
# MkDocs 2 drops the plugin system mkdocstrings needs.
docs = ["mkdocs<2", "mkdocs-material", "mkdocstrings[python]", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running cross-checks (tens of seconds each); run with -m \"\""]
# the suite runs the solver many times; the warning's own test uses pytest.warns
filterwarnings = ["ignore::graphtransport.shooting.hamiltonian.TorchThreadsWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/graphtransport"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"

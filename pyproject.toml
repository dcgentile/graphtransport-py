[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphtransport"
version = "0.1.0"
description = "Python port of GraphTransportation.jl: optimal transport and Wasserstein barycenters on graphs."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]
torch = ["torch"]
jax = ["jax"]
socp = ["cvxpy", "clarabel"]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/graphtransport"]
